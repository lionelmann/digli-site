<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Digli Collector Profile  The Atmospheric Collector">
  <defs>
    <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2438"/>
      <stop offset="45%" stop-color="#4a3a2a"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8f7428"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a1f4d"/><stop offset="100%" stop-color="#c45c26"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1b3a4b"/><stop offset="100%" stop-color="#7ec8e3"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3d1f1f"/><stop offset="100%" stop-color="#e8b86d"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14261a"/><stop offset="100%" stop-color="#6fbf73"/></linearGradient>
  </defs>
  <rect width="390" height="844" fill="#0b0b0f"/>
  <rect x="0" y="0" width="390" height="54" fill="#0b0b0f"/>
  <text x="28" y="36" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">9:41</text>
  <circle cx="330" cy="30" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="346" cy="30" r="5" fill="#fff" opacity="0.55"/>
  <circle cx="362" cy="30" r="5" fill="#fff" opacity="0.3"/>

  <text x="24" y="92" fill="#c9a84c" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">HOW YOU COLLECT</text>
  <text x="24" y="128" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Dig Profile</text>

  <!-- personality card -->
  <rect x="20" y="156" width="350" height="280" rx="22" fill="url(#aura)"/>
  <circle cx="195" cy="250" r="58" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="195" cy="250" r="46" fill="#121018"/>
  <circle cx="195" cy="250" r="14" fill="#c9a84c"/>
  <text x="195" y="340" text-anchor="middle" fill="#c9a84c" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">PERSONALITY</text>
  <text x="195" y="372" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">The Atmospheric</text>
  <text x="195" y="400" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Collector</text>

  <!-- hidden insight -->
  <rect x="20" y="452" width="350" height="118" rx="18" fill="#16161a"/>
  <text x="40" y="486" fill="#c9a84c" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">HIDDEN INSIGHT</text>
  <text x="40" y="516" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">You gravitate to dusk tones and</text>
  <text x="40" y="538" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">slow-burn side B deep cuts.</text>

  <!-- DNA chips -->
  <text x="24" y="606" fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">YOUR DNA</text>
  <rect x="20" y="622" width="78" height="34" rx="17" fill="#1f1f24"/>
  <text x="59" y="644" text-anchor="middle" fill="#fff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Jazz</text>
  <rect x="106" y="622" width="92" height="34" rx="17" fill="#1f1f24"/>
  <text x="152" y="644" text-anchor="middle" fill="#fff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Ambient</text>
  <rect x="206" y="622" width="78" height="34" rx="17" fill="#1f1f24"/>
  <text x="245" y="644" text-anchor="middle" fill="#fff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Soul</text>
  <rect x="292" y="622" width="78" height="34" rx="17" fill="#1f1f24"/>
  <text x="331" y="644" text-anchor="middle" fill="#fff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">70s</text>

  <!-- shelf previews -->
  <g transform="translate(20,678)">
    <rect width="72" height="72" rx="10" fill="url(#c1)"/>
    <rect x="86" width="72" height="72" rx="10" fill="url(#c2)"/>
    <rect x="172" width="72" height="72" rx="10" fill="url(#c3)"/>
    <rect x="258" width="72" height="72" rx="10" fill="url(#c4)"/>
  </g>

  <!-- tab bar -->
  <rect x="0" y="764" width="390" height="80" fill="#121212"/>
  <rect x="0" y="764" width="390" height="1" fill="#ffffff14"/>
  <g fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">
    <circle cx="55" cy="790" r="8" fill="#8a8a93"/>
    <text x="55" y="816">Shelf</text>
    <rect x="140" y="782" width="16" height="16" rx="3" fill="#8a8a93"/>
    <text x="148" y="816">Pile</text>
    <circle cx="241" cy="790" r="10" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="241" y="816">Scan</text>
    <circle cx="324" cy="790" r="8" fill="#c9a84c"/>
    <text x="324" y="816" fill="#c9a84c">Taste</text>
  </g>
