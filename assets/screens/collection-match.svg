<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Digli Collection Match screen">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2a6b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="#0b0b0f"/>
  <rect x="0" y="0" width="390" height="54" fill="#0b0b0f"/>
  <text x="28" y="36" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">9:41</text>
  <circle cx="330" cy="30" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="346" cy="30" r="5" fill="#fff" opacity="0.55"/>
  <circle cx="362" cy="30" r="5" fill="#fff" opacity="0.3"/>

  <text x="24" y="88" fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Album</text>

  <rect x="95" y="110" width="200" height="200" rx="12" fill="url(#cover)"/>
  <circle cx="195" cy="210" r="58" fill="none" stroke="#ffffff33" stroke-width="2"/>
  <circle cx="195" cy="210" r="16" fill="#0b0b0f"/>
  <circle cx="195" cy="210" r="6" fill="#c9a84c"/>

  <text x="195" y="346" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Bright Size Life</text>
  <text x="195" y="372" text-anchor="middle" fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15">Pat Metheny · 1976</text>

  <!-- match card -->
  <rect x="20" y="404" width="350" height="300" rx="22" fill="#16161a"/>
  <text x="40" y="442" fill="#c9a84c" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">COLLECTION MATCH</text>
  <text x="40" y="492" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">92%</text>
  <text x="150" y="492" fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">match</text>

  <text x="40" y="534" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Why it fits your shelf</text>

  <circle cx="48" cy="570" r="4" fill="#c9a84c"/>
  <text x="64" y="575" fill="#d8d8de" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Shares your jazz DNA</text>
  <circle cx="48" cy="606" r="4" fill="#c9a84c"/>
  <text x="64" y="611" fill="#d8d8de" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Sits beside your 70s eras</text>
  <circle cx="48" cy="642" r="4" fill="#c9a84c"/>
  <text x="64" y="647" fill="#d8d8de" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Open, airy textures you collect</text>

  <rect x="40" y="668" width="310" height="1" fill="#ffffff14"/>
  <text x="40" y="696" fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Tuned to your Dig Profile</text>

  <!-- tab bar -->
  <rect x="0" y="764" width="390" height="80" fill="#121212"/>
  <rect x="0" y="764" width="390" height="1" fill="#ffffff14"/>
  <g fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">
    <circle cx="55" cy="790" r="8" fill="#8a8a93"/>
    <text x="55" y="816">Shelf</text>
    <rect x="140" y="782" width="16" height="16" rx="3" fill="#8a8a93"/>
    <text x="148" y="816">Pile</text>
    <circle cx="241" cy="790" r="10" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="241" y="816">Scan</text>
    <rect x="316" y="782" width="16" height="16" rx="8" fill="#8a8a93"/>
    <text x="324" y="816">Want</text>
  </g>
</svg>
