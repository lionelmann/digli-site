<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Digli Scan screen">
  <defs>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2438"/>
      <stop offset="100%" stop-color="#121018"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2a6b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="390" height="844" fill="#08080a"/>
  <rect x="0" y="0" width="390" height="54" fill="#08080a"/>
  <text x="28" y="36" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">9:41</text>
  <circle cx="330" cy="30" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="346" cy="30" r="5" fill="#fff" opacity="0.55"/>
  <circle cx="362" cy="30" r="5" fill="#fff" opacity="0.3"/>

  <text x="195" y="88" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Scan</text>
  <text x="195" y="112" text-anchor="middle" fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Point at a cover or barcode</text>

  <!-- viewfinder -->
  <rect x="28" y="140" width="334" height="430" rx="28" fill="url(#cam)"/>
  <!-- album in frame -->
  <g transform="translate(95,210)" filter="url(#soft)">
    <rect width="200" height="200" rx="8" fill="url(#cover)"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#ffffff44" stroke-width="3"/>
    <circle cx="100" cy="100" r="54" fill="none" stroke="#ffffff22" stroke-width="1"/>
    <circle cx="100" cy="100" r="18" fill="#0b0b0f"/>
    <circle cx="100" cy="100" r="6" fill="#c9a84c"/>
  </g>
  <!-- corner brackets -->
  <path d="M48 168h36M48 168v36" stroke="#c9a84c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M342 168h-36M342 168v36" stroke="#c9a84c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M48 542h36M48 542v-36" stroke="#c9a84c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M342 542h-36M342 542v-36" stroke="#c9a84c" stroke-width="3" stroke-linecap="round" fill="none"/>

  <text x="195" y="610" text-anchor="middle" fill="#ffffffe0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">Hold steady to identify</text>

  <!-- capture button -->
  <circle cx="195" cy="690" r="36" fill="#c9a84c"/>
  <circle cx="195" cy="690" r="28" fill="none" stroke="#121212" stroke-width="3"/>
  <circle cx="195" cy="690" r="10" fill="#121212"/>

  <!-- tab bar -->
  <rect x="0" y="764" width="390" height="80" fill="#121212"/>
  <rect x="0" y="764" width="390" height="1" fill="#ffffff14"/>
  <g fill="#8a8a93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">
    <circle cx="55" cy="790" r="8" fill="#8a8a93"/>
    <text x="55" y="816">Shelf</text>
    <rect x="140" y="782" width="16" height="16" rx="3" fill="#8a8a93"/>
    <text x="148" y="816">Pile</text>
    <circle cx="241" cy="790" r="12" fill="#c9a84c"/>
    <circle cx="241" cy="790" r="5" fill="#121212"/>
    <text x="241" y="816" fill="#c9a84c">Scan</text>
    <rect x="316" y="782" width="16" height="16" rx="8" fill="#8a8a93"/>
    <text x="324" y="816">Want</text>
  </g>
</svg>
