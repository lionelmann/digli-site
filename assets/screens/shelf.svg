    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3d1f1f"/><stop offset="100%" stop-color="#e8b86d"/></linearGradient>
    <linearGradient id="a4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14261a"/><stop offset="100%" stop-color="#6fbf73"/></linearGradient>
    <linearGradient id="a5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2b1040"/><stop offset="100%" stop-color="#d94f8b"/></linearGradient>
